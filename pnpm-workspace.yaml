# Which packages may run install scripts. `true` runs the script (memod
# builds its dist/); `false` records a deliberate skip, so the default strict
# mode does not fail the install for ignoring a build that is not needed.
# A key is a package name: pnpm 10.28 rejects a key that holds a git spec
# ("Invalid versions union").
allowBuilds:
  memod: true
  # Its postinstall fetches the CUDA/TensorRT provider binaries from NuGet;
  # the CPU runtime the embedding model uses ships in the package, so none of
  # those files is needed and the download is large.
  onnxruntime-node: false
  # Its postinstall only prints a version-scheme warning; dist/ and index.d.ts
  # ship in the package.
  protobufjs: false
